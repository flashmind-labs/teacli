name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Restore cross-compiled packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: crossbuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            crossbuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/teacli-${goos}-${goarch}"
            [ "$goos" = windows ] && out="${out}.exe"
            GOOS="$goos" GOARCH="$goarch" go build -o "$out" -ldflags="-s -w" .
          done
          chmod +x dist/teacli-linux-* dist/teacli-darwin-*

      # install.sh and `teacli update` both parse this file and refuse to
      # install an asset that has no entry in it, so the names must stay bare.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > ../checksums.txt

      - name: Verify the tag matches the compiled version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          built=$(./dist/teacli-linux-amd64 --version | awk '{print $NF}')
          if [ "$tag" != "$built" ]; then
            echo "tag v$tag does not match the built version $built (cmd/root.go)" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            checksums.txt

      - name: Publish to R2
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: |
          set -euo pipefail
          : "${CF_ENDPOINT:?Missing CF_ENDPOINT}" "${CF_ACCESS_KEY_ID:?Missing CF_ACCESS_KEY_ID}" "${CF_SECRET_ACCESS_KEY:?Missing CF_SECRET_ACCESS_KEY}" "${CF_BUCKET:?Missing CF_BUCKET}"
          upload() {
            local file=$1 key=$2 content_type=$3
            curl -fsS --retry 3 --aws-sigv4 'aws:amz:auto:s3' \
              --user "$CF_ACCESS_KEY_ID:$CF_SECRET_ACCESS_KEY" \
              -H "x-amz-content-sha256: $(sha256sum "$file" | cut -d ' ' -f 1)" \
              -H 'Cache-Control: no-cache' -H "Content-Type: $content_type" \
              -T "$file" "$CF_ENDPOINT/$CF_BUCKET/teacli/$key" > /dev/null
          }
          for file in dist/* checksums.txt; do upload "$file" "$GITHUB_REF_NAME/${file##*/}" application/octet-stream; done
          upload install.sh install.sh 'text/plain; charset=utf-8'
          upload install.ps1 install.ps1 'text/plain; charset=utf-8'
          printf '%s\n' "$GITHUB_REF_NAME" > latest.txt
          upload latest.txt latest.txt 'text/plain; charset=utf-8'
